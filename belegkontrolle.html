<style>
  :root{
    --bg:#0e0e10;
    --surface:#16161a;
    --surface2:#1e1e23;
    --line:#2b2b31;
    --text:#f1f1f3;
    --muted:#9b9ba5;
    --red:#ff0000;
    --red-soft:rgba(255,0,0,.13);
    --green:#35c47a;
    --green-bg:rgba(53,196,122,.12);
    --amber:#f2a93b;
    --amber-bg:rgba(242,169,59,.13);
    --privat:#6f8fd1;
    --privat-bg:rgba(111,143,209,.12);
    --umbuchung:#3fb6c9;
    --umbuchung-bg:rgba(63,182,201,.12);
    --aircash:#b07be0;
    --aircash-bg:rgba(176,123,224,.13);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);}
  body{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;}
  h1,h2,h3{font-family:'Archivo',sans-serif;margin:0 0 6px 0;font-weight:700;letter-spacing:-.01em;}
  h2{font-size:24px;}
  h3{font-size:16px;}
  .hidden{display:none !important;}
  .muted{color:var(--muted);}

  input,select,textarea{
    width:100%;font-family:inherit;font-size:16px;padding:10px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent;}
  input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--red);}
  button{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid var(--red);background:var(--red);color:#fff;
    padding:10px 16px;border-radius:8px;
  }
  button:hover{filter:brightness(1.1);}
  button.secondary{background:transparent;color:var(--text);border-color:var(--line);}
  button.secondary:hover{background:var(--surface2);}
  button.danger{background:transparent;border-color:var(--red);color:var(--red);}
  button.small{padding:5px 9px;font-size:12px;}

  /* Login */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);padding:36px 30px;width:100%;max-width:360px;border-radius:14px;border:1px solid var(--line);}
  .logo{width:46px;height:46px;border-radius:10px;background:var(--red);color:#fff;font-family:'Archivo';font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}

  /* Shell */
  #app{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--line);padding:24px 0;flex-shrink:0;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px 22px 20px;}
  .brand .logo{width:34px;height:34px;font-size:20px;margin:0;border-radius:8px;}
  .brand span{font-family:'Archivo';font-weight:700;font-size:16px;}
  .nav-item{display:block;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;border-radius:0;color:var(--muted);padding:11px 20px;font-weight:500;}
  .nav-item:hover{background:var(--surface2);color:var(--text);filter:none;}
  .nav-item.active{color:var(--text);border-left-color:var(--red);background:var(--surface2);}
  .sidebar-foot{margin-top:auto;padding:16px 20px;}
  .user-email{font-size:12px;color:var(--muted);margin-bottom:8px;word-break:break-all;}
  main{flex:1;padding:30px 34px 60px 34px;min-width:0;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 0 0 0;}
    .brand{padding:0 16px 10px 16px;}
    .nav{display:flex;overflow-x:auto;}
    .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:10px 14px;width:auto;}
    .nav-item.active{border-bottom-color:var(--red);background:none;}
    .sidebar-foot{display:none;}
    .mobile-logout{display:inline-block !important;margin-left:auto;}
    main{padding:20px 14px 60px 14px;}
  }
  .mobile-logout{display:none;}

  .view-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--amber);background:var(--amber-bg);}
  .badge.ok{color:var(--green);background:var(--green-bg);}
  .month-picker{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .month-picker select{width:auto;}
  .helptext{color:var(--muted);font-size:13px;margin:6px 0 14px 0;max-width:640px;}
  .empty-note{color:var(--muted);font-size:14px;padding:16px 0;}

  /* Tabellen */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:10px;white-space:nowrap;}
  tbody td,tfoot td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:none;}
  td.amount,th.amount{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .neg{color:#ff5a5a;}
  .pos{color:var(--green);}
  td.nowrap{white-space:nowrap;}
  tr.row-missing{background:var(--amber-bg);}
  tr.row-missing td:first-child{box-shadow:inset 3px 0 0 var(--amber);}
  tr.row-skip{background:var(--red-soft);}
  tr.row-skip td:first-child{box-shadow:inset 3px 0 0 var(--red);}
  tr.row-ok td:first-child{box-shadow:inset 3px 0 0 var(--green);}
  tr.row-privat{background:var(--privat-bg);}
  tr.row-privat td:first-child{box-shadow:inset 3px 0 0 var(--privat);}
  tr.row-umbuchung{background:var(--umbuchung-bg);}
  tr.row-umbuchung td:first-child{box-shadow:inset 3px 0 0 var(--umbuchung);}
  tr.row-aircash{background:var(--aircash-bg);}
  tr.row-aircash td:first-child{box-shadow:inset 3px 0 0 var(--aircash);}
  tr.row-dup{opacity:.45;}
  .dup-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-bg);border-radius:999px;padding:2px 8px;white-space:nowrap;}
  .status-cell{min-width:200px;}
  .status-cell select{padding:6px 8px;font-size:14px;margin-bottom:5px;}
  .status-cell input{padding:6px 8px;font-size:14px;}
  .row-actions{white-space:nowrap;}
  .row-actions button{margin-right:4px;}
  .section-label{display:flex;align-items:center;gap:10px;margin:22px 0 10px 0;}
  .section-label h3{margin:0;}
  .print-only{display:none;}

  /* Kacheln */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:12px;}
  .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--line);}
  .stat-box .label{font-size:12px;color:var(--muted);font-weight:500;}
  .stat-box .value{font-family:'Archivo';font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .stat-box .sub{font-size:12px;color:var(--muted);}
  .stat-box.ok{border-top-color:var(--green);}
  .stat-box.warn{border-top-color:var(--amber);}
  .stat-box.skip{border-top-color:var(--red);}
  .stat-box.privat{border-top-color:var(--privat);}
  .stat-box.umbuchung{border-top-color:var(--umbuchung);}
  .stat-box.aircash{border-top-color:var(--aircash);}
  .overview-table td:first-child{font-weight:600;}
  .overview-table tr.total td{border-top:1px solid var(--line);font-weight:700;}

  /* Werkzeugleisten */
  .search-bar{margin:6px 0 10px 0;}
  .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .filter-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;font-size:13px;border-radius:999px;font-weight:500;}
  .filter-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
  .export-bar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px 0;}
  .bulk-toolbar{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface2);border:1px solid var(--red);border-radius:12px;padding:10px;margin-bottom:12px;}
  .bulk-toolbar .count{font-weight:600;margin-right:6px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin-bottom:10px;}
  .form-grid .full{grid-column:1 / -1;}
  @media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .check-label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;max-width:600px;}
  #pdf-preview-wrap input,#pdf-preview-wrap select{padding:6px 7px;font-size:14px;}
  .print-title{display:none;}

  /* Druck / PDF */
  @media print{
    @page{size:A4 landscape;margin:12mm;}
    html,body{background:#fff !important;color:#000 !important;font-size:10.5px;}
    *{color:#000 !important;box-shadow:none !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .sidebar,.month-picker,.search-bar,.filter-bar,.bulk-toolbar,.export-bar,.row-actions,.sel-col,.badge,#login-screen,.no-print{display:none !important;}
    #app{display:block;}
    main{padding:0;}
    .view-header{margin-bottom:6px;}
    .print-title{display:block;font-size:11px;margin-bottom:10px;white-space:pre-line;}
    .table-wrap{border:1px solid #999;border-radius:0;background:#fff;overflow:visible;}
    thead th,tbody td,tfoot td{border-color:#bbb !important;padding:4px 6px;}
    .stat-box{background:#fff;border:1px solid #999;border-top-width:3px;}
    .stats{grid-template-columns:repeat(4,1fr);}
    .status-cell select,.status-cell input{display:none !important;}
    .print-only{display:inline;}
    tr{page-break-inside:avoid;}
    tr.row-missing{background:#fdf0d9 !important;}
    tr.row-skip{background:#fbdcdc !important;}
    tr.row-privat,tr.row-umbuchung,tr.row-aircash{background:#eef1f7 !important;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="logo">B</div>
    <h2>Belegkontrolle</h2>
    <p class="muted" style="margin:0 0 20px 0;">BIT-Elektrotechnik</p>
    <div class="field">
      <label for="login-email">E-Mail</label>
      <input type="email" id="login-email" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">Passwort</label>
      <input type="password" id="login-password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button style="width:100%" onclick="login()">Anmelden</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">B</div><span>Belegkontrolle</span>
      <button class="secondary small mobile-logout" onclick="logout()">Abmelden</button></div>
    <nav class="nav">
      <button class="nav-item" data-view="monat" onclick="switchView('monat')">Monatsübersicht</button>
      <button class="nav-item" data-view="jahr" onclick="switchView('jahr')">Jahresübersicht</button>
      <button class="nav-item" data-view="eingabe" onclick="switchView('eingabe')">Bar Belege</button>
      <button class="nav-item" data-view="pdf" onclick="switchView('pdf')">Kontoauszüge</button>
    </nav>
    <div class="sidebar-foot">
      <div class="user-email" id="user-email"></div>
      <button class="secondary" style="width:100%" onclick="logout()">Abmelden</button>
    </div>
  </aside>

  <main>
    <!-- MONATSÜBERSICHT -->
    <section id="view-monat">
      <div class="view-header">
        <h2>Monatsübersicht</h2>
        <span class="badge" id="monat-badge">–</span>
      </div>
      <div class="print-title" id="monat-print-title"></div>
      <div class="month-picker">
        <select id="monat-monat"></select>
        <select id="monat-jahr"></select>
        <button class="secondary" onclick="loadMonat()">Anzeigen</button>
      </div>
      <div id="monat-overview"></div>
      <div class="export-bar">
        <button class="secondary" onclick="exportMonatCSV()">CSV herunterladen</button>
        <button class="secondary" onclick="printView('monat')">Drucken / PDF</button>
      </div>
      <div class="search-bar">
        <input type="search" id="monat-search" placeholder="Suchen: Name, Betrag oder Datum" oninput="setSearchTerm(this.value)">
      </div>
      <div class="filter-bar" id="monat-filter-bar">
        <button class="filter-btn active" data-filter="alle" onclick="setStatusFilter('alle')">Alle</button>
        <button class="filter-btn" data-filter="offen" onclick="setStatusFilter('offen')">Fehlt noch</button>
        <button class="filter-btn" data-filter="gefunden" onclick="setStatusFilter('gefunden')">Gefunden</button>
        <button class="filter-btn" data-filter="skip" onclick="setStatusFilter('skip')">Nicht auffindbar</button>
        <button class="filter-btn" data-filter="privat" onclick="setStatusFilter('privat')">Privat</button>
        <button class="filter-btn" data-filter="umbuchung" onclick="setStatusFilter('umbuchung')">Bargeldabhebung</button>
        <button class="filter-btn" data-filter="aircash" onclick="setStatusFilter('aircash')">Aircash</button>
      </div>
      <div id="monat-results"></div>
    </section>

    <!-- JAHRESÜBERSICHT -->
    <section id="view-jahr" class="hidden">
      <div class="view-header"><h2>Jahresübersicht</h2></div>
      <div class="print-title" id="jahr-print-title"></div>
      <div class="month-picker">
        <select id="jahr-jahr"></select>
        <button class="secondary" onclick="loadJahr()">Anzeigen</button>
      </div>
      <div class="export-bar">
        <button class="secondary" onclick="exportJahrCSV()">CSV herunterladen</button>
        <button class="secondary" onclick="printView('jahr')">Drucken / PDF</button>
      </div>
      <div id="jahr-content"></div>
    </section>

    <!-- BAR BELEGE -->
    <section id="view-eingabe" class="hidden">
      <div class="view-header"><h2>Bar Belege</h2></div>
      <div class="card">
        <label class="field" style="display:block;margin:0;">
          <span style="font-weight:600;">Beleg fotografieren (Beta)</span>
          <span class="helptext" style="display:block;margin:4px 0 10px 0;">Datum und Betrag werden aus dem Foto gelesen. Bitte danach prüfen.</span>
          <input type="file" id="in-foto" accept="image/*" capture="environment" onchange="handleReceiptPhoto(event)">
        </label>
        <div id="foto-status" class="helptext" style="margin-bottom:0;"></div>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Datum</label>
          <input type="date" id="in-datum">
        </div>
        <div class="field">
          <label>Typ</label>
          <select id="in-typ">
            <option value="Bar" selected>Bar</option>
            <option value="Bank">Bank</option>
          </select>
        </div>
        <div class="field full">
          <label>Beschreibung</label>
          <input type="text" id="in-beschreibung" placeholder="z. B. Bauhaus, Tankstelle">
        </div>
        <div class="field">
          <label>Betrag (€)</label>
          <input type="text" inputmode="decimal" id="in-betrag" placeholder="45,90">
        </div>
        <div class="field">
          <label>Art</label>
          <select id="in-art">
            <option value="aus" selected>Ausgabe</option>
            <option value="ein">Einnahme</option>
          </select>
        </div>
        <div class="field">
          <label>Beleg</label>
          <select id="in-status">
            <option value="gefunden" selected>Gefunden</option>
            <option value="offen">Fehlt noch</option>
          </select>
        </div>
        <div class="field" style="display:flex;align-items:flex-end;">

        </div>

      <p class="helptext">Oder den Text aus dem PDF kopieren und hier einfügen:</p>
      <textarea id="pdf-text" rows="6" style="max-width:700px;" placeholder="Text aus dem Kontoauszug"></textarea>
      <div style="margin-top:10px;"><button onclick="parsePdf()">Buchungen erkennen</button></div>
      <div id="pdf-status" class="helptext"></div>

  </main>
</div>

<script>
// ================= Konfiguration =================
const SUPABASE_URL = "https://uruzvjpaqangracysigp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ch-bJoOYR5K_sI7A_17Z5A_YyY_MY-l";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const RESET_FLAGS = { beleg_gefunden:false, nicht_auffindbar:false, privat:false, umbuchung:false, aircash:false };

// ================= Auth =================
async function login(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = "Anmeldung fehlgeschlagen: " + error.message; return; }
  await onLoggedIn();
}
async function logout(){
  await sb.auth.signOut();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}
async function onLoggedIn(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-email').textContent = session.user.email;
  initPickers();
  switchView('monat');
}
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('in-datum').value = isoToday();
  document.getElementById('pdf-jahr').value = new Date().getFullYear();
  const { data: { session } } = await sb.auth.getSession();
  if(session) onLoggedIn();
});

// ================= Navigation =================
function switchView(name){
  ['monat','jahr','eingabe','pdf'].forEach(v => {
    document.getElementById('view-'+v).classList.toggle('hidden', v !== name);
  });
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if(name === 'monat') loadMonat();
  if(name === 'jahr') loadJahr();
}
let pickersReady = false;
function initPickers(){
  if(pickersReady) return;
  pickersReady = true;
  const now = new Date();
  document.getElementById('monat-monat').innerHTML = MONTH_NAMES.map((m,i) =>
    `<option value="${i+1}" ${i===now.getMonth()?'selected':''}>${m}</option>`).join('');
  const years = [];
  for(let y = 2023; y <= now.getFullYear() + 1; y++) years.push(y);
  const opts = years.map(y => `<option value="${y}" ${y===now.getFullYear()?'selected':''}>${y}</option>`).join('');
  document.getElementById('monat-jahr').innerHTML = opts;
  document.getElementById('jahr-jahr').innerHTML = opts;
}

// ================= Helpers =================
function isoToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatEUR(n){
  return (Number(n)||0).toLocaleString('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
}
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso){ return iso ? iso.split('-').reverse().join('.') : '–'; }
function parseAmount(str){
  let s = String(str||'').trim().replace(/\s/g,'').replace('€','');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  return parseFloat(s);
}
function signClass(n){ return n < 0 ? 'neg' : (n > 0 ? 'pos' : ''); }
function isNeutral(r){ return !!(r.privat || r.umbuchung || r.aircash); }
function statusOf(r){
  if(r.privat) return 'privat';
  if(r.umbuchung) return 'umbuchung';
  if(r.aircash) return 'aircash';
  if(r.nicht_auffindbar) return 'skip';
  if(r.beleg_gefunden) return 'gefunden';
  return 'offen';
}
const STATUS_LABELS = { offen:'Fehlt noch', gefunden:'Gefunden', skip:'Nicht auffindbar', privat:'Privat', umbuchung:'Bargeldabhebung', aircash:'Aircash' };
function statusLabel(r){ return STATUS_LABELS[statusOf(r)]; }
const ROW_CLASS = { offen:'row-missing', gefunden:'row-ok', skip:'row-skip', privat:'row-privat', umbuchung:'row-umbuchung', aircash:'row-aircash' };
function sum(rows, fn){ return rows.reduce((s,r) => s + fn(r), 0); }
function num(r){ return Number(r.betrag) || 0; }

// Alle Zeilen holen (Supabase liefert max. 1000 pro Abfrage)
async function fetchAll(buildQuery){
  const pageSize = 1000;
  let from = 0, all = [];
  while(true){
    const { data, error } = await buildQuery().range(from, from + pageSize - 1);
    if(error) return { data:null, error };
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return { data: all, error: null };
}

// ================= Berechnungen =================
function computeStats(rows){
  const biz = rows.filter(r => !isNeutral(r));
  const einnahmen = sum(biz.filter(r => num(r) > 0), num);
  const ausgaben = sum(biz.filter(r => num(r) < 0), num);
  const geprueft = sum(biz, r => r.beleg_gefunden && !r.nicht_auffindbar ? num(r) : -Math.abs(num(r)));
  return { einnahmen, ausgaben, saldo: einnahmen + ausgaben, geprueft };
}

function overviewTableHtml(rows){
  const line = (label, rs, cls) => {
    const s = computeStats(rs);
    return `<tr class="${cls||''}"><td>${label}</td>
      <td class="amount pos">${formatEUR(s.einnahmen)}</td>
      <td class="amount neg">${formatEUR(s.ausgaben)}</td>
      <td class="amount ${signClass(s.saldo)}">${formatEUR(s.saldo)}</td>
      <td class="amount ${signClass(s.geprueft)}">${formatEUR(s.geprueft)}</td></tr>`;
  };
  return `<div class="table-wrap"><table class="overview-table">
    <thead><tr><th></th><th class="amount">Einnahmen</th><th class="amount">Ausgaben</th><th class="amount">Saldo</th><th class="amount">Geprüfter Saldo</th></tr></thead>
    <tbody>
      ${line('Bank', rows.filter(r => r.typ === 'Bank'))}
      ${line('Bar', rows.filter(r => r.typ === 'Bar'))}
      ${line('Gesamt', rows, 'total')}
    </tbody></table></div>`;
}

function statBox(cls, label, value, sub, valueClass){
  return `<div class="stat-box ${cls}"><div class="label">${label}</div>
    <div class="value ${valueClass ?? signClass(value)}">${formatEUR(value)}</div><div class="sub">${sub}</div></div>`;
}
function countTxt(n){ return n === 1 ? '1 Buchung' : n + ' Buchungen'; }

function statusStatsHtml(rows){
  const biz = rows.filter(r => !isNeutral(r));
  const belegt = biz.filter(r => statusOf(r) === 'gefunden');
  const fehlt = biz.filter(r => statusOf(r) === 'offen');
  const skip = biz.filter(r => statusOf(r) === 'skip');
  const privat = rows.filter(r => r.privat);
  const umb = rows.filter(r => !r.privat && r.umbuchung);
  const air = rows.filter(r => !r.privat && !r.umbuchung && r.aircash);
  const sumUmb = sum(umb, num);
  const sumAir = sum(air, num);
  // Bargeld, das durch Bar-Belege (auch private) bereits erklärt ist
  const barVerbraucht = sum(rows.filter(r => r.typ === 'Bar' && num(r) < 0), num);
  const offenBar = -(sumUmb + sumAir) + barVerbraucht;
  return `<div class="stats">
      ${statBox('ok', 'Belegt', sum(belegt, num), countTxt(belegt.length))}
      ${statBox('warn', 'Fehlt noch', sum(fehlt, r => -Math.abs(num(r))), countTxt(fehlt.length))}
      ${statBox('skip', 'Nicht auffindbar', sum(skip, r => -Math.abs(num(r))), countTxt(skip.length))}
      ${statBox('privat', 'Privat', sum(privat, num), countTxt(privat.length))}
    </div>
    <div class="stats">
      ${statBox('umbuchung', 'Bargeldabhebungen', sumUmb, countTxt(umb.length))}
      ${statBox('aircash', 'Aircash', sumAir, countTxt(air.length))}
      ${statBox(offenBar > 0.005 ? 'warn' : 'ok', 'Noch nicht durch Bar-Belege erklärt', offenBar > 0.005 ? offenBar : 0,
        offenBar > 0.005 ? 'Abhebungen + Aircash minus Bar-Ausgaben' : 'vollständig erklärt', '')}
    </div>`;
}

// ================= Monatsübersicht =================
let editingRowId = null;
let currentMonatData = [];
let selectedIds = new Set();
let statusFilter = 'alle';
let searchTerm = '';

async function loadMonat(){
  // neuer Monat: Auswahl, Filter und Suche zurücksetzen
  selectedIds = new Set();
  editingRowId = null;
  statusFilter = 'alle';
  searchTerm = '';
  document.getElementById('monat-search').value = '';
  updateFilterButtons();
  await refreshMonat();
}

// lädt die Daten neu, behält Filter, Suche und Scrollposition
async function refreshMonat(){
  const monat = parseInt(document.getElementById('monat-monat').value, 10);
  const jahr = parseInt(document.getElementById('monat-jahr').value, 10);
  const scrollY = window.scrollY;
  const { data, error } = await fetchAll(() => sb.from('transactions').select('*')
    .eq('jahr', jahr).eq('monat', monat).order('datum', { ascending: true }).order('created_at', { ascending: true }));
  if(error){
    document.getElementById('monat-overview').innerHTML = '';
    document.getElementById('monat-results').innerHTML = '<p class="empty-note">Fehler beim Laden: ' + esc(error.message) + '</p>';
    return;
  }
  currentMonatData = data || [];
  const ids = new Set(currentMonatData.map(r => r.id));
  selectedIds = new Set([...selectedIds].filter(id => ids.has(id)));
  renderMonatContent();
  window.scrollTo(0, scrollY);
}

function renderMonatContent(){
  const data = currentMonatData;
  const badge = document.getElementById('monat-badge');
  const offen = data.filter(r => statusOf(r) === 'offen').length;
  if(data.length === 0){ badge.textContent = 'keine Buchungen'; badge.className = 'badge'; }
  else if(offen === 0){ badge.textContent = 'alle Belege geklärt'; badge.className = 'badge ok'; }
  else { badge.textContent = offen + ' Beleg(e) fehlen noch'; badge.className = 'badge'; }
  document.getElementById('monat-overview').innerHTML = data.length ? overviewTableHtml(data) + statusStatsHtml(data) : '';
  renderResults();
}

function renderResults(){
  const el = document.getElementById('monat-results');
  if(currentMonatData.length === 0){
    el.innerHTML = '<p class="empty-note">Keine Buchungen für diesen Monat. Kontoauszug unter „Kontoauszüge“ importieren.</p>';
    return;
  }
  el.innerHTML = bulkToolbarHtml() + renderFilteredTables();
}

function setSearchTerm(v){ searchTerm = v; renderResults(); }
function setStatusFilter(f){ statusFilter = f; updateFilterButtons(); renderResults(); }
function updateFilterButtons(){
  document.querySelectorAll('#monat-filter-bar .filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === statusFilter));
}

function matchesSearch(r){
  const q = searchTerm.trim().toLowerCase();
  if(!q) return true;
  const b = num(r);
  const hay = [
    r.beschreibung, r.notiz, formatEUR(b), b.toFixed(2), b.toFixed(2).replace('.', ','),
    Math.abs(b).toFixed(2), Math.abs(b).toFixed(2).replace('.', ','), fmtDate(r.datum), r.datum
  ].join(' ').toLowerCase();
  return hay.includes(q);
}

function getFilteredData(data){
  return data.filter(r => (statusFilter === 'alle' || statusOf(r) === statusFilter) && matchesSearch(r));
}

function renderFilteredTables(){
  const filtered = getFilteredData(currentMonatData);
  if(filtered.length === 0) return '<p class="empty-note">Keine Buchungen für diesen Filter.</p>';
  return renderTypeBlock('Bank', filtered.filter(r => r.typ === 'Bank')) +
         renderTypeBlock('Bar', filtered.filter(r => r.typ === 'Bar'));
}

function bulkToolbarHtml(){
  if(selectedIds.size === 0) return '';
  return `<div class="bulk-toolbar">
    <span class="count">${selectedIds.size} ausgewählt</span>
    <button class="small" onclick="bulkUpdateStatus('gefunden')">Gefunden</button>
    <button class="small secondary" onclick="bulkUpdateStatus('skip')">Nicht auffindbar</button>
    <button class="small secondary" onclick="bulkUpdateStatus('privat')">Privat</button>
    <button class="small secondary" onclick="bulkUpdateStatus('umbuchung')">Als Bargeldabhebung</button>
    <button class="small secondary" onclick="bulkUpdateStatus('aircash')">Als Aircash</button>
    <button class="small secondary" onclick="bulkUpdateStatus('offen')">Fehlt noch</button>
    <button class="small secondary" onclick="clearSelection()">Auswahl aufheben</button>
  </div>`;
}
function toggleSelect(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  renderResults();
}
function toggleSelectAllBlock(el){
  const ids = (el.dataset.ids || '').split(',').filter(Boolean);
  ids.forEach(id => el.checked ? selectedIds.add(id) : selectedIds.delete(id));
  renderResults();
}
function clearSelection(){ selectedIds = new Set(); renderResults(); }

function flagsFor(value){
  const u = { ...RESET_FLAGS };
  if(value === 'gefunden') u.beleg_gefunden = true;
  if(value === 'skip') u.nicht_auffindbar = true;
  if(value === 'privat') u.privat = true;
  if(value === 'umbuchung') u.umbuchung = true;
  if(value === 'aircash') u.aircash = true;
  return u;
}
async function bulkUpdateStatus(value){
  const ids = [...selectedIds];
  if(ids.length === 0) return;
  const { error } = await sb.from('transactions').update(flagsFor(value)).in('id', ids);
  if(error){ alert('Fehler: ' + error.message); return; }
  selectedIds = new Set();
  await refreshMonat();
}
async function updateBelegStatus(id, value){
  const { error } = await sb.from('transactions').update(flagsFor(value)).eq('id', id);
  if(error){ alert('Fehler: ' + error.message); return; }
  await refreshMonat();
}
async function updateNotiz(id, value){
  const notiz = value.trim() || null;
  const { error } = await sb.from('transactions').update({ notiz }).eq('id', id);
  if(error){ alert('Fehler: ' + error.message); return; }
  const r = currentMonatData.find(x => x.id === id);
  if(r) r.notiz = notiz;
}

function statusSelectHtml(r){
  const st = statusOf(r);
  const opt = (v) => `<option value="${v}" ${st === v ? 'selected' : ''}>${STATUS_LABELS[v]}</option>`;
  return `<select onchange="updateBelegStatus('${r.id}', this.value)">
      ${opt('offen')}${opt('gefunden')}${opt('skip')}${opt('privat')}${opt('umbuchung')}${opt('aircash')}
    </select>
    <input type="text" placeholder="Notiz" value="${esc(r.notiz)}" onchange="updateNotiz('${r.id}', this.value)">
    <span class="print-only"><b>${STATUS_LABELS[st]}</b>${r.notiz ? ' – ' + esc(r.notiz) : ''}</span>`;
}

function renderTypeBlock(typ, rows){
  if(rows.length === 0) return '';
  const biz = rows.filter(r => !isNeutral(r));
  const einnahmen = sum(biz.filter(r => num(r) > 0), num);
  const ausgaben = sum(biz.filter(r => num(r) < 0), num);
  const allSel = rows.every(r => selectedIds.has(r.id));
  const body = rows.map(r => {
    const st = statusOf(r);
    if(editingRowId === r.id){
      return `<tr class="${ROW_CLASS[st]}">
        <td class="sel-col"></td>
        <td><input type="date" id="edit-datum" value="${r.datum || ''}"></td>
        <td><input type="text" id="edit-beschreibung" value="${esc(r.beschreibung)}"></td>
        <td><input type="text" inputmode="decimal" id="edit-betrag" value="${num(r).toFixed(2).replace('.', ',')}" style="width:110px;"></td>
        <td><select id="edit-typ"><option value="Bank" ${r.typ==='Bank'?'selected':''}>Bank</option><option value="Bar" ${r.typ==='Bar'?'selected':''}>Bar</option></select></td>
        <td class="row-actions"><button class="small" onclick="saveEdit('${r.id}')">Speichern</button><button class="small secondary" onclick="cancelEdit()">Abbrechen</button></td>
      </tr>`;
    }
    return `<tr class="${ROW_CLASS[st]}">
      <td class="sel-col"><input type="checkbox" ${selectedIds.has(r.id) ? 'checked' : ''} onchange="toggleSelect('${r.id}', this.checked)"></td>
      <td class="nowrap">${fmtDate(r.datum)}</td>
      <td>${esc(r.beschreibung)}</td>
      <td class="amount ${signClass(num(r))}">${formatEUR(num(r))}</td>
      <td class="status-cell">${statusSelectHtml(r)}</td>
      <td class="row-actions"><button class="small secondary" onclick="startEdit('${r.id}')">Bearbeiten</button><button class="small danger" onclick="deleteRow('${r.id}')">Löschen</button></td>
    </tr>`;
  }).join('');
  return `<div class="section-label"><h3>${typ}</h3><span class="muted">${countTxt(rows.length)}</span></div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th class="sel-col"><input type="checkbox" ${allSel ? 'checked' : ''} data-ids="${rows.map(r => r.id).join(',')}" onchange="toggleSelectAllBlock(this)"></th>
        <th>Datum</th><th>Beschreibung</th><th class="amount">Betrag</th><th>Beleg / Notiz</th><th class="row-actions"></th>
      </tr></thead>
      <tbody>${body}</tbody>
      <tfoot>
        <tr><td class="sel-col"></td><td colspan="2">Einnahmen ${typ}</td><td class="amount pos">${formatEUR(einnahmen)}</td><td colspan="2" class="muted" style="font-weight:400;">ohne Privat, Bargeldabhebung, Aircash</td></tr>
        <tr><td class="sel-col"></td><td colspan="2">Ausgaben ${typ}</td><td class="amount neg">${formatEUR(ausgaben)}</td><td colspan="2"></td></tr>
        <tr><td class="sel-col"></td><td colspan="2">Saldo ${typ}</td><td class="amount ${signClass(einnahmen + ausgaben)}">${formatEUR(einnahmen + ausgaben)}</td><td colspan="2"></td></tr>
      </tfoot>
    </table></div>`;
}

function startEdit(id){ editingRowId = id; renderResults(); }
function cancelEdit(){ editingRowId = null; renderResults(); }
async function saveEdit(id){
  const datum = document.getElementById('edit-datum').value;
  const beschreibung = document.getElementById('edit-beschreibung').value.trim();
  const betrag = parseAmount(document.getElementById('edit-betrag').value);
  const typ = document.getElementById('edit-typ').value;
  if(!datum || !beschreibung || isNaN(betrag)){ alert('Bitte Datum, Beschreibung und Betrag ausfüllen.'); return; }
  const [y, m] = datum.split('-').map(Number);
  const { error } = await sb.from('transactions').update({ datum, jahr: y, monat: m, beschreibung, betrag, typ }).eq('id', id);
  if(error){ alert('Fehler: ' + error.message); return; }
  editingRowId = null;
  await refreshMonat();
}
async function deleteRow(id){
  if(!confirm('Diese Buchung wirklich löschen?')) return;
  const { error } = await sb.from('transactions').delete().eq('id', id);
  if(error){ alert('Fehler: ' + error.message); return; }
  selectedIds.delete(id);
  await refreshMonat();
}

// ================= Jahresübersicht =================
let lastJahrRows = [];
let lastJahrNr = null;
let lastJahrPerMonth = null;

function emptyMonth(){
  return { einnahmen:0, ausgaben:0, geprueft:0, belegt:0, fehlt:0, skip:0, privat:0, umbuchung:0, aircash:0, offen:0, gesamt:0 };
}
function aggregateMonth(rows){
  const m = emptyMonth();
  const s = computeStats(rows);
  m.einnahmen = s.einnahmen; m.ausgaben = s.ausgaben; m.geprueft = s.geprueft;
  rows.forEach(r => {
    const st = statusOf(r), b = num(r);
    m.gesamt++;
    if(st === 'privat') m.privat += b;
    else if(st === 'umbuchung') m.umbuchung += b;
    else if(st === 'aircash') m.aircash += b;
    else if(st === 'gefunden') m.belegt += b;
    else if(st === 'skip') m.skip += -Math.abs(b);
    else { m.fehlt += -Math.abs(b); m.offen++; }
  });
  return m;
}

async function loadJahr(){
  const jahr = parseInt(document.getElementById('jahr-jahr').value, 10);
  const content = document.getElementById('jahr-content');
  const { data, error } = await fetchAll(() => sb.from('transactions').select('*').eq('jahr', jahr).order('datum', { ascending: true }));
  if(error){ content.innerHTML = '<p class="empty-note">Fehler beim Laden: ' + esc(error.message) + '</p>'; return; }
  lastJahrRows = data || [];
  lastJahrNr = jahr;
  if(lastJahrRows.length === 0){
    lastJahrPerMonth = null;
    content.innerHTML = '<p class="empty-note">Keine Buchungen für dieses Jahr.</p>';
    return;
  }
  const perMonth = {};
  for(let m = 1; m <= 12; m++) perMonth[m] = aggregateMonth(lastJahrRows.filter(r => r.monat === m));
  lastJahrPerMonth = perMonth;
  const total = aggregateMonth(lastJahrRows);

  const cells = (m) => `
    <td class="amount pos">${formatEUR(m.einnahmen)}</td>
    <td class="amount neg">${formatEUR(m.ausgaben)}</td>
    <td class="amount ${signClass(m.einnahmen + m.ausgaben)}">${formatEUR(m.einnahmen + m.ausgaben)}</td>
    <td class="amount ${signClass(m.geprueft)}">${formatEUR(m.geprueft)}</td>
    <td class="amount">${formatEUR(m.belegt)}</td>
    <td class="amount ${signClass(m.fehlt)}">${formatEUR(m.fehlt)}</td>
    <td class="amount ${signClass(m.skip)}">${formatEUR(m.skip)}</td>
    <td class="amount">${formatEUR(m.privat)}</td>
    <td class="amount">${formatEUR(m.umbuchung)}</td>
    <td class="amount">${formatEUR(m.aircash)}</td>
    <td>${m.offen === 0 ? '<span class="badge ok">vollständig</span>' : '<span class="badge">' + m.offen + ' offen</span>'}</td>`;
  const rows = MONTH_NAMES.map((name, i) => {
    const m = perMonth[i+1];
    if(m.gesamt === 0) return '';
    return `<tr><td>${name}</td>${cells(m)}</tr>`;
  }).join('');

  content.innerHTML = overviewTableHtml(lastJahrRows) + statusStatsHtml(lastJahrRows) + `
    <div class="table-wrap"><table>
      <thead><tr><th>Monat</th><th class="amount">Einnahmen</th><th class="amount">Ausgaben</th><th class="amount">Saldo</th>
        <th class="amount">Geprüft</th><th class="amount">Belegt</th><th class="amount">Fehlt</th><th class="amount">Nicht auffindbar</th>
        <th class="amount">Privat</th><th class="amount">Bargeld</th><th class="amount">Aircash</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Jahr gesamt</td>${cells(total)}</tr></tfoot>
    </table></div>`;
}

// ================= Export: CSV und Drucken =================
function csvNum(n){ return (Number(n) || 0).toFixed(2).replace('.', ','); }
function csvCell(v){
  const s = String(v ?? '');
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(filename, rows){
  const text = '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
  const blob = new Blob([text], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const FILTER_LABELS = { alle:'Alle', offen:'Fehlt noch', gefunden:'Gefunden', skip:'Nicht auffindbar', privat:'Privat', umbuchung:'Bargeldabhebung', aircash:'Aircash' };

function exportMonatCSV(){
  const monat = parseInt(document.getElementById('monat-monat').value, 10);
  const jahr = parseInt(document.getElementById('monat-jahr').value, 10);
  const rows = getFilteredData(currentMonatData);
  if(rows.length === 0){ alert('Keine Buchungen zum Exportieren.'); return; }
  const sorted = [...rows.filter(r => r.typ === 'Bank'), ...rows.filter(r => r.typ === 'Bar')];
  const out = [['Datum','Typ','Beschreibung','Betrag','Status','Notiz']];
  sorted.forEach(r => out.push([fmtDate(r.datum), r.typ, r.beschreibung, csvNum(num(r)), statusLabel(r), r.notiz || '']));
  const suffix = statusFilter === 'alle' ? '' : '_' + FILTER_LABELS[statusFilter].replace(/\s+/g, '-');
  downloadCSV(`Belegkontrolle_${jahr}-${String(monat).padStart(2,'0')}${suffix}.csv`, out);
}

function exportJahrCSV(){
  if(!lastJahrPerMonth){ alert('Keine Buchungen zum Exportieren.'); return; }
  const out = [['Monat','Einnahmen','Ausgaben','Saldo','Geprüfter Saldo','Belegt','Fehlt noch','Nicht auffindbar','Privat','Bargeldabhebung','Aircash','Offene Belege']];
  const line = (name, m) => [name, csvNum(m.einnahmen), csvNum(m.ausgaben), csvNum(m.einnahmen + m.ausgaben), csvNum(m.geprueft),
    csvNum(m.belegt), csvNum(m.fehlt), csvNum(m.skip), csvNum(m.privat), csvNum(m.umbuchung), csvNum(m.aircash), m.offen];
  MONTH_NAMES.forEach((name, i) => { const m = lastJahrPerMonth[i+1]; if(m.gesamt) out.push(line(name, m)); });
  out.push(line('Jahr gesamt', aggregateMonth(lastJahrRows)));
  downloadCSV(`Belegkontrolle_${lastJahrNr}_Jahresuebersicht.csv`, out);
}

function printView(which){
  const now = new Date().toLocaleDateString('de-DE');
  if(which === 'monat'){
    const monat = parseInt(document.getElementById('monat-monat').value, 10);
    const jahr = parseInt(document.getElementById('monat-jahr').value, 10);
    let t = `BIT-Elektrotechnik – Belegkontrolle ${MONTH_NAMES[monat-1]} ${jahr}`;
    if(statusFilter !== 'alle') t += `\nFilter: ${FILTER_LABELS[statusFilter]}`;
    if(searchTerm.trim()) t += `\nSuche: „${searchTerm.trim()}“`;
    t += `\nStand: ${now}`;
    document.getElementById('monat-print-title').textContent = t;
  } else {
    document.getElementById('jahr-print-title').textContent =
      `BIT-Elektrotechnik – Belegkontrolle Jahresübersicht ${lastJahrNr || ''}\nStand: ${now}`;
  }
  window.print();
}

// ================= Bar Belege: manuelle Eingabe =================
async function submitManuell(){
  const datum = document.getElementById('in-datum').value;
  const typ = document.getElementById('in-typ').value;
  const beschreibung = document.getElementById('in-beschreibung').value.trim();
  const roh = parseAmount(document.getElementById('in-betrag').value);
  const art = document.getElementById('in-art').value;
  const gefunden = document.getElementById('in-status').value === 'gefunden';
  const privat = document.getElementById('in-privat').checked;
  const notiz = document.getElementById('in-notiz').value.trim() || null;
  const statusEl = document.getElementById('eingabe-status');

  if(!datum || !beschreibung || isNaN(roh)){
    statusEl.textContent = 'Bitte Datum, Beschreibung und Betrag ausfüllen.';
    statusEl.style.color = 'var(--red)';
    return;
  }
  const betrag = art === 'ein' ? Math.abs(roh) : -Math.abs(roh);
  const [y, m] = datum.split('-').map(Number);
  const { data: { session } } = await sb.auth.getSession();
  const { error } = await sb.from('transactions').insert({
    jahr: y, monat: m, datum, typ, beschreibung, betrag,
    beleg_gefunden: !privat && gefunden, nicht_auffindbar: false, privat, umbuchung: false, aircash: false,
    notiz, erstellt_von: session.user.email
  });
  if(error){
    statusEl.textContent = 'Fehler beim Speichern: ' + error.message;
    statusEl.style.color = 'var(--red)';
    return;
  }
  statusEl.textContent = `Gespeichert: ${beschreibung}, ${formatEUR(betrag)}`;
  statusEl.style.color = 'var(--green)';
  ['in-beschreibung','in-betrag','in-notiz','in-foto'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('in-privat').checked = false;
  document.getElementById('foto-status').textContent = '';
}

async function handleReceiptPhoto(event){
  const file = event.target.files && event.target.files[0];
  const st = document.getElementById('foto-status');
  if(!file) return;
  if(!window.Tesseract){ st.textContent = 'Texterkennung konnte nicht geladen werden.'; return; }
  st.textContent = 'Beleg wird gelesen …';
  try{
    const result = await Tesseract.recognize(file, 'deu', {
      logger: m => { if(m.status === 'recognizing text') st.textContent = 'Beleg wird gelesen … ' + Math.round(m.progress * 100) + ' %'; }
    });
    const text = result.data.text || '';
    const amounts = (text.match(/\d{1,3}(?:[.,]\d{3})*[.,]\d{2}(?!\d)/g) || []).map(a => {
      const norm = a.replace(/[.,](?=\d{3}(?:[.,]|$))/g, '').replace(',', '.');
      return parseFloat(norm);
    }).filter(n => !isNaN(n) && n < 100000);
    const found = [];
    if(amounts.length){
      const max = Math.max(...amounts);
      document.getElementById('in-betrag').value = max.toFixed(2).replace('.', ',');
      document.getElementById('in-art').value = 'aus';
      found.push('Betrag ' + formatEUR(max));
    }
    const dm = text.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
    if(dm){
      let yy = dm[3].length === 2 ? '20' + dm[3] : dm[3];
      const iso = `${yy}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
      if(!isNaN(new Date(iso))){ document.getElementById('in-datum').value = iso; found.push('Datum ' + fmtDate(iso)); }
    }
    const first = text.split('\n').map(l => l.trim()).find(l => /[A-Za-zÄÖÜäöü]{3,}/.test(l));
    if(first && !document.getElementById('in-beschreibung').value) document.getElementById('in-beschreibung').value = first.slice(0, 60);
    st.textContent = found.length ? 'Erkannt: ' + found.join(', ') + '. Bitte prüfen.' : 'Nichts erkannt. Bitte von Hand eintragen.';
  } catch(e){
    st.textContent = 'Fehler beim Lesen: ' + e.message;
  }
}

// ================= Kontoauszüge (Qonto) =================
async function handlePdfFile(event){
  const file = event.target.files && event.target.files[0];
  const st = document.getElementById('pdf-status');
  if(!file) return;
  if(!window.pdfjsLib){ st.textContent = 'PDF-Leser konnte nicht geladen werden. Bitte Text einfügen.'; return; }
  st.style.color = '';
  st.textContent = 'PDF wird gelesen …';
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let all = [];
    for(let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let line = '', lastY = null, lastEndX = null;
      tc.items.forEach(it => {
        if(!it.str) return;
        const x = it.transform[4], y = it.transform[5];
        if(lastY !== null && Math.abs(y - lastY) > 2){
          all.push(line); line = ''; lastEndX = null;
        }
        if(lastEndX !== null && x - lastEndX > 1.5 && line && !line.endsWith(' ')) line += ' ';
        line += it.str;
        lastY = y;
        lastEndX = x + (it.width || 0);
      });
      if(line) all.push(line);
    }
    const text = all.join('\n');
    document.getElementById('pdf-text').value = text;
    const ym = text.match(/\d{2}\/\d{2}\/(20\d{2})/);
    if(ym) document.getElementById('pdf-jahr').value = ym[1];
    await parsePdf();
  } catch(e){
    st.textContent = 'Fehler beim Lesen der PDF: ' + e.message;
    st.style.color = 'var(--red)';
  }
}

function guessKategorie(beschreibung, betrag){
  const d = beschreibung || '';
  if(/aircash/i.test(d)) return 'aircash';
  if(betrag < 0 && /(\bATM\b|bargeld|geldautomat|abhebung|withdrawal|deutsche bank|sparkasse|volksbank|raiffeisen|ing-diba|\bING\b|commerzbank|postbank|hypovereinsbank|targobank|santander)/i.test(d)) return 'bargeld';
  return 'normal';
}
function normDesc(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '').slice(0, 20); }
function dupKey(datum, betrag){ return `${datum}|${Number(betrag).toFixed(2)}`; }

let pdfResults = [];
async function parsePdf(){
  const st = document.getElementById('pdf-status');
  const jahr = parseInt(document.getElementById('pdf-jahr').value, 10);
  const text = document.getElementById('pdf-text').value;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const singleLineRe = /^(\d{2})\/(\d{2})\s+(.*?)\s+([+-])\s*([\d.,]+)\s*EUR$/;
  const dateLineRe = /^(\d{2})\/(\d{2})\s+(.*)$/;
  const amountLineRe = /^([+-])\s*([\d.,]+)\s*EUR$/;
  const results = [];
  let current = null;
  const pushRow = (tag, mon, desc, sign, raw) => {
    const n = Math.abs(parseAmount(raw));
    if(isNaN(n)) return;
    const betrag = sign === '-' ? -n : n;
    results.push({ tag, monatNr: mon, beschreibung: desc, betrag, typ: 'Bank', kategorie: guessKategorie(desc, betrag), dup: false });
  };
  for(const line of lines){
    const sm = line.match(singleLineRe);
    if(sm){ pushRow(sm[1], sm[2], sm[3], sm[4], sm[5]); current = null; continue; }
    const dm = line.match(dateLineRe);
    if(dm){ current = { tag: dm[1], monatNr: dm[2], beschreibung: [dm[3]] }; continue; }
    const am = line.match(amountLineRe);
    if(am && current){
      pushRow(current.tag, current.monatNr, current.beschreibung.join(' ').replace(/\s+/g, ' ').trim(), am[1], am[2]);
      current = null; continue;
    }
    if(current) current.beschreibung.push(line);
  }

  // Doppelt-Schutz: mit vorhandenen Buchungen des Jahres vergleichen
  if(results.length && jahr){
    const { data } = await fetchAll(() => sb.from('transactions').select('datum,betrag,beschreibung').eq('jahr', jahr));
    const existing = {};
    (data || []).forEach(r => {
      const k = dupKey(r.datum, r.betrag);
      (existing[k] = existing[k] || []).push(normDesc(r.beschreibung));
    });
    results.forEach(r => {
      const a = normDesc(r.beschreibung);
      const list = existing[dupKey(`${jahr}-${r.monatNr}-${r.tag}`, r.betrag)] || [];
      r.dup = list.some(b => a.startsWith(b) || b.startsWith(a));
    });
  }
  pdfResults = results;
  st.style.color = '';
  st.textContent = '';
  renderPdfPreview(results);
}

function renderPdfPreview(results){
  const wrap = document.getElementById('pdf-preview-wrap');
  if(results.length === 0){
    wrap.innerHTML = '<p class="empty-note">Keine Buchungen erkannt. Bitte prüfen, ob es ein Qonto-Kontoauszug ist.</p>';
    return;
  }
  const dupCount = results.filter(r => r.dup).length;
  const katOpt = (r, v, label) => `<option value="${v}" ${r.kategorie === v ? 'selected' : ''}>${label}</option>`;
  const rows = results.map((r, i) => `
    <tr class="${r.dup ? 'row-dup' : (r.kategorie === 'aircash' ? 'row-aircash' : (r.kategorie === 'bargeld' ? 'row-umbuchung' : ''))}">
      <td><input type="checkbox" class="pdf-row-check" ${r.dup ? '' : 'checked'}></td>
      <td><input type="text" value="${r.tag}/${r.monatNr}" data-field="datum" style="width:70px;"></td>
      <td><input type="text" value="${esc(r.beschreibung)}" data-field="beschreibung" style="min-width:240px;"></td>
      <td><input type="text" inputmode="decimal" value="${r.betrag.toFixed(2).replace('.', ',')}" data-field="betrag" style="width:105px;"></td>
      <td><select data-field="typ" style="width:85px;"><option value="Bank" selected>Bank</option><option value="Bar">Bar</option></select></td>
      <td><select data-field="kategorie" style="width:165px;">
        ${katOpt(r, 'normal', 'Normal')}${katOpt(r, 'bargeld', 'Bargeldabhebung')}${katOpt(r, 'aircash', 'Aircash')}
      </select></td>
      <td>${r.dup ? '<span class="dup-tag">schon vorhanden</span>' : ''}</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <p style="margin:10px 0;">${results.length} Buchungen erkannt.${dupCount ? ` <span class="dup-tag">${dupCount} schon vorhanden</span> und deshalb abgewählt.` : ''} Bitte prüfen und dann übernehmen.</p>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>TT/MM</th><th>Beschreibung</th><th class="amount">Betrag</th><th>Typ</th><th>Kategorie</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <button onclick="confirmPdfImport()">Ausgewählte übernehmen</button>
    <div id="pdf-import-status" class="helptext"></div>`;
}

async function confirmPdfImport(){
  const jahr = parseInt(document.getElementById('pdf-jahr').value, 10);
  const statusEl = document.getElementById('pdf-import-status');
  if(!jahr){ statusEl.textContent = 'Bitte oben das Jahr des Auszugs angeben.'; statusEl.style.color = 'var(--red)'; return; }
  const { data: { session } } = await sb.auth.getSession();
  const toInsert = [];
  document.querySelectorAll('#pdf-preview-wrap tbody tr').forEach(row => {
    if(!row.querySelector('.pdf-row-check').checked) return;
    const [tag, monatNr] = row.querySelector('[data-field="datum"]').value.split('/').map(s => (s || '').trim());
    const beschreibung = row.querySelector('[data-field="beschreibung"]').value.trim();
    const betrag = parseAmount(row.querySelector('[data-field="betrag"]').value);
    const typ = row.querySelector('[data-field="typ"]').value;
    const kat = row.querySelector('[data-field="kategorie"]').value;
    const mon = parseInt(monatNr, 10);
    if(!tag || !mon || mon < 1 || mon > 12 || isNaN(betrag)) return;
    toInsert.push({
      jahr, monat: mon, datum: `${jahr}-${String(mon).padStart(2,'0')}-${tag.padStart(2,'0')}`,
      typ, beschreibung, betrag,
      beleg_gefunden: false, nicht_auffindbar: false, privat: false,
      umbuchung: kat === 'bargeld', aircash: kat === 'aircash',
      notiz: null, erstellt_von: session.user.email
    });
  });
  if(toInsert.length === 0){ statusEl.textContent = 'Keine Zeile ausgewählt.'; statusEl.style.color = 'var(--red)'; return; }
  const { error } = await sb.from('transactions').insert(toInsert);
  if(error){ statusEl.textContent = 'Fehler beim Speichern: ' + error.message; statusEl.style.color = 'var(--red)'; return; }
  document.getElementById('pdf-text').value = '';
  document.getElementById('pdf-file').value = '';
  document.getElementById('pdf-preview-wrap').innerHTML = '';
  const st = document.getElementById('pdf-status');
  st.textContent = toInsert.length + ' Buchungen übernommen.';
  st.style.color = 'var(--green)';
}
